name: Ratchet & Clank (USA)
sha1: 61a44859bad6588e63277dbe00c7c2c9feeb87c2

options:
  basename: SCUS_971.99
  target_path: assets/boot_elf.elf
  elf_path: SCUS_971.99
  base_path: ../
  platform: ps2
  compiler: EEGCC

  asm_path: code/_generated
  src_path: code/
  data_path: build/data
  build_path: build
  o_as_suffix: True  # otherwise splat will try to link with e.g. .cpp.o

  find_file_boundaries: False
  disasm_unknown: True
  named_regs_for_c_funcs: False

  pair_rodata_to_text: False  # Not having this crashes splat
  rodata_string_guesser_level: 0

  # We probably need this at some point:
  # https://github.com/ethteck/splat/wiki/Configuration#gp_value

  # Might want this later
  generate_asm_macros_files: False

  create_undefined_funcs_auto: True
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  create_undefined_syms_auto: True
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: config/symbols.txt

  ld_legacy_generation: True


  check_consecutive_segment_types: False

  # Not handling overlays here at all yet. 

  # Sly1 and KH1 decomps use this, I'm assuming we want to too.
  subalign: 8

segments:
  - [0, databin, elf_header]

  - { start: 0x80, type: data, name: vutext, linker_section: .vutext, vram: 0x100080 }

  - name: core.text
    type: code
    start: 0x12380
    vram: 0x112380
    subsegments:
    - [0x12380, asm, glibc]
    - [0x18750, asm, sce/lib]
    - [0x2d728, asm, sce/crt0]
    - [0x2d8f8, cpp, game/boot]
    - [0x2da28, c, 989snd/ee/989snd_pre]
    - [0x2dc80, c, 989snd/ee/989snd_flush]
    - [0x2de00, c, 989snd/ee/989snd_mid]
    - [0x2df20, c, 989snd/ee/989snd_mid_byloc]
    - [0x2e088, c, 989snd/ee/989snd_bankload]
    - [0x2e198, c, 989snd/ee/989snd_post]
    - [0x2f1c8, cpp, game/permcb]
    - [0x2f208, cpp, game/wad]

  - name: core.data
    type: data
    start: 0x2f480
    vram: 0x0012f480

  - name: core.rdata
    type: rdata
    start: 0x52200
    vram: 0x00152200

  - name: core.bss
    type: data
    bss_size: 0xab20
    pair_segment: core.text
    start: 0x54100
    vram: 0x00154100

  - name: core.lit
    type: lit4
    start: 0x5ec80
    vram: 0x0015ec80

  - name: lit
    type: lit4
    start: 0x5ef00
    vram: 0x0015ef00

  - name: bss
    type: data
    pair_segment: text
    start: 0x61280
    vram: 0x00161280

  - name: data
    type: data
    start: 0x65480
    vram: 0x00165480

  # The original build keeps the dense-switch jump tables EGC compiles for
  # freeze.o (mode_freezeInit, later DrawDialogText/UpdateModeFreeze) inside
  # the data segment at 0x1E78D0+. Splat models that region as a raw blob, so
  # the jtbl hole is carved out as its own segment. Before every link,
  # tools/patch_freeze_rodata_ld.py places freeze.o(.rodata) there (or the
  # blob's bytes, while that TU is still all INCLUDE_ASM).
  - name: data_freeze
    type: data
    start: 0xe78d0
    vram: 0x1e78d0

  - name: data_suffix
    type: data
    start: 0xe78f0
    vram: 0x1e78f0

  # The original build keeps the dense-switch jump table EGC compiles for
  # help.o (func_001FDC08, the Help state machine) inside the data segment at
  # 0x1E7A20. Splat models that region as a raw blob, so the jtbl hole is
  # carved out as its own segment. Before every link,
  # tools/patch_rodata_ld.py places help.o(.rodata) there (or the blob's bytes
  # while that TU is still all INCLUDE_ASM).
  - name: data_help
    type: data
    start: 0xe7a20
    vram: 0x1e7a20

  - name: data_suffix2
    type: data
    start: 0xe7a40
    vram: 0x1e7a40

  - name: lvl.vtbl
    type: rodata
    start: 0xe8b80
    vram: 0x1e8b80

  - name: lvl.camvtbl
    type: rodata
    start: 0xe8c00
    vram: 0x1e8c00

  - name: lvl.sndvtbl
    type: rodata
    start: 0xe8c80
    vram: 0x1e8c80

  - name: text
    type: code
